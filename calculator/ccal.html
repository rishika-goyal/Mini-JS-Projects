<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="ccal.css">
</head>
<body>
    <div class="baap">
        <h1 class="heading"> Welcome to Calculate me !!</h1>
        <div class="container">
            <input class="input" type="text">
            <div class="row">
                <button class="btn yes">C</button><button class="btn yes">M+</button>
                <button class="btn yes">M-</button><button class="btn yes">/</button>
            </div>
            <div class="row">
                <button class="btn">7</button><button class="btn">8</button>
                <button class="btn">9</button><button class="btn yes">*</button>
            </div>
            <div class="row">
                <button class="btn">4</button><button class="btn">5</button>
                <button class="btn">6</button><button class="btn yes">-</button>
            </div>
            <div class="row">
                <button class="btn">1</button><button class="btn">2</button>
                <button class="btn">3</button><button class="btn yes">+</button>
            </div>
            <div class="row">
                <button class="btn">%</button><button class="btn">0</button>
                <button class="btn">.</button><button class="btn yes1">=</button>
            </div>
        </div>
    </div>

    <script src="ccal.js"></script>
</body>
</html>
